<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروسي للابتدائي - مدارس جودة التعليم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .page-header h1 { color: #d35400; font-size: 2.5rem; font-weight: 900; margin-bottom: 30px; }
        .primary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .primary-card { background: #fffdf9; border: 3px dashed #e67e22; border-radius: 20px; padding: 30px; text-decoration: none; color: #2c3e50; font-weight: 700; font-size: 1.2rem; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .primary-card:hover { transform: scale(1.03); background: #fdfbf7; border-color: #d35400; }
        .primary-card i { font-size: 2.5rem; color: #e67e22; margin-bottom: 15px; display: block; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #d35400; text-decoration: none; font-weight: 700; float: right; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
        <div style="clear: both;"></div>
        <div class="page-header">
            <h1>دروسي للابتدائي</h1>
        </div>

        <div class="primary-grid">
            <a href="https://drive.google.com/drive/folders/1dyXJBZFbrL1OcumAIQ6U5rvJ6gdzWnqN" target="_blank" class="primary-card">
                <i class="fas fa-star"></i> السَّنَةُ الأُولَى ابْتِدَائِي (1AP)
            </a>
            <a href="https://drive.google.com/drive/folders/1P7V7nhXHfGBTIERgwxrezFHa_S9mZihX" target="_blank" class="primary-card">
                <i class="fas fa-heart"></i> السَّنَةُ الثَّانِيَةُ ابْتِدَائِي (2AP)
            </a>
            <a href="https://drive.google.com/drive/folders/1Ap7QQrZxmjJHNDk6LgIfbaNKqldW3sHX" target="_blank" class="primary-card">
                <i class="fas fa-smile"></i> السَّنَةُ الثَّالِثَةُ ابْتِدَائِي (3AP)
            </a>
            <a href="https://drive.google.com/drive/folders/1swsKUBm_aS8FjD7Rg4eZaR4mQKVudy6q" target="_blank" class="primary-card">
                <i class="fas fa-sun"></i> السَّنَةُ الرَّابِعَةُ ابْتِدَائِي (4AP)
            </a>
            <a href="https://drive.google.com/drive/folders/1RQvlqzcKXRA2ciI94m4og1Xo9T3gHQ7W" target="_blank" class="primary-card">
                <i class="fas fa-graduation-cap"></i> السَّنَةُ الخَامِسَةُ ابْتِدَائِي (5AP)
            </a>
        </div>
    </div>
</body>
</html>
